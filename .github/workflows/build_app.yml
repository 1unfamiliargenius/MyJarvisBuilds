name: Build JARVIS App

on:
  repository_dispatch:
    types: [build_app]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Parse Project JSON and Create Files
        run: |
          echo "Parsing project JSON..."
          echo '${{ github.event.client_payload.project_json }}' > project_data.json
          # Here we would use a script to extract files from the JSON and write them
          # For a real implementation, the AI should generate a specific structure
          # e.g., {"files": [{"path": "app/src/main/java/...", "content": "..."}]}
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-generated-app
          path: app/build/outputs/apk/debug/*.apk
